services:

  php:
    build:
      context: ./
      dockerfile: infrastructure/dev/php/Dockerfile
    image: blog-php:dev
    container_name: blog_php
    ports:
      - "9000:9000"
    # volumes:
    #   - ./application:/var/www/application
    networks:
      - blog-networks

  nginx:
    image: nginx:1.30-alpine
    container_name: blog_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/dev/nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ./application/public:/var/www/application/public
    networks:
      - blog-networks


  postgres:
    image: postgres:16
    container_name: blog_pg
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - blog-networks

volumes:
  pg_data:

networks:
  blog-networks:
    driver: bridge